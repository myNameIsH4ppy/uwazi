services:
  uwazi:
    build:
      context: .
      dockerfile: uwazi.Dockerfile
    container_name: uwazi-server
    environment:
      - DBHOST=${DBHOST}
      - REDIS_HOST=${REDIS_HOST}
      - ELASTICSEARCH_URL=${ELASTICSEARCH_URL}
      - DATABASE_NAME=${DATABASE_NAME}
      - INDEX_NAME=${INDEX_NAME}
      - NODE_ENV=${NODE_ENV}
      - FILES_ROOT_PATH=${FILES_ROOT_PATH}
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - CHOKIDAR_INTERVAL=1000
    depends_on:
      - mongo
    platform: linux/amd64
    volumes:
      - ./:/uwazi
      - ${UPLOADED_DOCUMENTS}
      - ${CUSTOM_UPLOADS}
      - ${TEMPORAL_FILES}
      - ${LOG}
    ports:
      - '3000:3000'
      - '8080:8080'
    networks:
      - uwazi-network

  elasticsearch:
    build:
      context: .
      dockerfile: elastic-icu-8.18.0.Dockerfile
    container_name: uwazi-elasticsearch
    mem_limit: 4g
    volumes:
      - esdata01:/usr/share/elasticsearch/data
      - ${ES_BACKUP_PATH}
    ports:
      - '9200:9200'
    networks:
      - uwazi-network
    environment:
      - bootstrap.memory_lock=true
      - indices.query.bool.max_clause_count=2048
      - discovery.type=single-node
      - 'ES_JAVA_OPTS=-Xms2g -Xmx2g'
      - cluster.routing.allocation.disk.threshold_enabled=false
      - path.repo=/usr/share/elasticsearch/backup
      - xpack.security.enabled=false

  mongo:
    image: 'mongo:6.0'
    container_name: uwazi-mongo
    command: mongod --replSet "uwazi_replica_set"
    volumes:
      - mongodata:/data/db
      - ${MONGO_DUMP_PATH}
    ports:
      - '27017:27017'
    ulimits:
      nofile:
        soft: '65536'
        hard: '65536'
    networks:
      - uwazi-network

  mongoreplicaset_start_script:
    image: 'mongo:6.0'
    restart: 'no'
    container_name: mongoreplicaset_start_script
    depends_on:
      - mongo
    networks:
      - uwazi-network
    entrypoint:
      - bash
      - -c
      - |
        sleep 1 && mongosh --host mongo:27017 --eval '
        rs.initiate();
        cfg = rs.config();
        cfg.members[0].host = "mongo:27017";
        rs.reconfig(cfg, {force:true});
        '

  redis:
    image: 'redis:5.0.14'
    container_name: uwazi-redis
    command: redis-server
    ports:
      - '6379:6379'
    environment:
      - REDIS_REPLICATION_MODE=master
    networks:
      - uwazi-network

  minio:
    image: minio/minio
    container_name: uwazi-s3
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - ./storage/minio:/data
    command: server /data --console-address :9001
    networks:
      - uwazi-network

volumes:
  esdata01:
    driver: local
  mongodata:
    driver: local

networks:
  uwazi-network:
    driver: bridge
