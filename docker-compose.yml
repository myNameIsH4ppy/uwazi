services:
  uwazi:
    build:
      context: .
      dockerfile: uwazi.Dockerfile
    container_name: uwazi-server
    environment:
      - DBHOST=mongo
      - REDIS_HOST=redis
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - DATABASE_NAME=felice #<my_db_name>
      - INDEX_NAME=felice #<my_db_name>
      - NODE_ENV=production
      - FILES_ROOT_PATH=/uwazi
    depends_on:
      - mongo
    platform: linux/amd64
    volumes:
      - ./:/uwazi
      - ./uploaded_documents:/uwazi/uploaded_documents
      - ./custom_uploads:/uwazi/custom_uploads
      - ./temporal_files:/uwazi/temporal_files
      - ./log:/uwazi/log
    ports:
      - '3000:3000'
    networks:
      - uwazi-network

  elasticsearch:
    build:
      context: .
      dockerfile: elastic-icu-7.17.7.Dockerfile
    container_name: uwazi-elasticsearch
    volumes:
      - esdata01:/usr/share/elasticsearch/data
    ports:
      - '9200:9200'
    networks:
      - uwazi-network
    environment:
      - bootstrap.memory_lock=true
      - indices.query.bool.max_clause_count=2048
      - discovery.type=single-node
      - 'ES_JAVA_OPTS=-Xms2g -Xmx2g'
      - cluster.routing.allocation.disk.threshold_enabled=false

  mongo:
    image: 'mongo:6.0'
    container_name: uwazi-mongo
    command: mongod --replSet "uwazi_replica_set"
    volumes:
      - mongodata:/data/db
    ports:
      - '27017:27017'
    ulimits:
      nofile:
        soft: '65536'
        hard: '65536'
    networks:
      - uwazi-network

  mongoreplicaset_start_script:
    image: 'mongo:6.0'
    restart: 'no'
    container_name: mongoreplicaset_start_script
    depends_on:
      - mongo
    networks:
      - uwazi-network
    entrypoint:
      - bash
      - -c
      - |
        sleep 1 && mongosh --host mongo:27017 --eval '
        rs.initiate();
        cfg = rs.config();
        cfg.members[0].host = "mongo:27017";
        rs.reconfig(cfg, {force:true});
        '

  redis:
    image: 'redis:5.0.14'
    container_name: uwazi-redis
    command: redis-server
    ports:
      - '6379:6379'
    environment:
      - REDIS_REPLICATION_MODE=master
    networks:
      - uwazi-network

  minio:
    image: minio/minio
    container_name: uwazi-s3
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - ./storage/minio:/data
    command: server /data --console-address :9001
    networks:
      - uwazi-network

volumes:
  esdata01:
    driver: local
  mongodata:
    driver: local

networks:
  uwazi-network:
    driver: bridge
